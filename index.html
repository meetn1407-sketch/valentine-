<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Valentine</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="card">

  <h1>Will you be my Valentine? 💖</h1>

  <div class="buttons">
    <button id="yesBtn">Yes 💘</button>
    <button id="noBtn">No 😐</button>
  </div>

  <!-- YES RESULT -->
  <div id="result">
    <h2>Yayyy! Best decision ever 🥳</h2>

    <img
      src="https://media.giphy.com/media/3oriO0OEd9QIDdllqo/giphy.gif"
      alt="funny dog"
    >

    <p class="makeout">Wanna make out? 💋</p>
  </div>

</div>

<!-- NO popup -->
<div id="noPopup">
  <div class="popupBox">
    😈 You can't say NO
    <br><br>
    <button id="closeBtn">Okay 😳</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
